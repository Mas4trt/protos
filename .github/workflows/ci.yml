name: Proto CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: latest

      - name: Buf lint
        run: buf lint

      - name: Buf breaking
        run: buf breaking --against '.git#ref=origin/main'

  push:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: latest

      - name: Buf push
        run: buf push
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}